name: Title

on:
  pull_request_target:
    types: [ opened, edited, reopened, synchronize ]

permissions:
  pull-requests: read

jobs:
  title:
    name: title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        with:
          subjectPattern: ^[ -~]+$
          subjectPatternError: The subject "{subject}" goes into CHANGELOG.md as is, so write it in English (ASCII).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
