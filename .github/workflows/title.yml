name: Title

on:
  pull_request_target:
    branches: [ main ]
    types: [ opened, edited, reopened, synchronize ]

permissions:
  pull-requests: read

jobs:
  title:
    name: title
    runs-on: ubuntu-latest

    steps:
      # squash 병합에서는 PR 제목이 main의 커밋이 되고, 그대로 CHANGELOG에 들어갑니다.
      - name: PR 제목 검사
        uses: amannn/action-semantic-pull-request@v6
        with:
          subjectPattern: ^[ -~]+$
          subjectPatternError: |
            PR 제목의 설명 "{subject}"은 CHANGELOG에 그대로 들어가므로 영어(ASCII)로 써 주세요
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
