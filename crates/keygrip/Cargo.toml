[package]
name = "keygrip"
description = "Typed, key-centric DynamoDB access: derive key schemas on your models and work through a small table handle"
readme = "../../README.md"
keywords = ["dynamodb", "aws", "database", "serde", "derive"]
categories = ["database"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["dynamodb"]
dynamodb = [
    "dep:aws-sdk-dynamodb",
    "dep:serde_dynamo",
    "dep:thiserror",
]

[dependencies]
aws-sdk-dynamodb = { workspace = true, optional = true }
keygrip-derive = { version = "=0.1.0", path = "../keygrip-derive" }
serde.workspace = true
serde_dynamo = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[package.metadata.docs.rs]
all-features = true
