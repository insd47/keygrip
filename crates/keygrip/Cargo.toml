[package]
name = "keygrip"
description = "Typed, key-centric DynamoDB access: derive schemas on models and work through live entities"
readme = "../../README.md"
keywords = ["dynamodb", "aws", "database", "serde", "derive"]
categories = ["database"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["dynamodb"]
dynamodb = []

[dependencies]
aws-sdk-dynamodb.workspace = true
keygrip-derive.workspace = true
serde.workspace = true
serde_dynamo.workspace = true
thiserror.workspace = true

[dev-dependencies]
aws-smithy-http-client.workspace = true
aws-smithy-types.workspace = true
http.workspace = true
serde_json.workspace = true
tokio.workspace = true
trybuild.workspace = true

[package.metadata.docs.rs]
all-features = true
